name: Build installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the installer name and the release tag, e.g. 1.0.5"
        required: true
        default: "1.0.4"
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          $v = $v.Trim()
          if ($v -notmatch '^\d+(\.\d+){1,3}([-.][0-9A-Za-z.]+)?$') {
            throw "invalid version string: '$v'"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "building version $v (tag v$v)"

      - name: Preflight payload
        shell: pwsh
        run: ./scripts/preflight.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          Write-Host "ISCC = $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build with Inno Setup
        shell: pwsh
        run: |
          & $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\Install.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $built = @(Get-ChildItem -Path dist -Filter '*.exe' -File)
          if ($built.Count -eq 0) { throw 'no installer produced' }
          $built | ForEach-Object { Write-Host ("built: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Checksums
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist\SHA256SUMS.txt'
          if (Test-Path $out) { Remove-Item $out -Force }
          Get-ChildItem -Path dist -Filter '*.exe' -File | ForEach-Object {
            $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath $out -Append -Encoding ascii
          }
          Get-Content $out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = "${{ steps.ver.outputs.tag }}"
          $ver   = "${{ steps.ver.outputs.version }}"
          $files = @(Get-ChildItem -Path dist -File | ForEach-Object { $_.FullName })
          $notes = @"
          ChromeBook CoolStar Audio Drivers $ver

          * installer: 64-bit, Inno Setup
          * payload:  ${{ github.sha }}
          * verify with SHA256SUMS.txt
          "@

          $pre = "${{ github.event.inputs.prerelease }}"
          $isPush = "${{ github.event_name }}" -eq 'push'
          $args = @('release', 'create', $tag, '--title', $tag, '--notes', $notes)
          if (-not $isPush -and $pre -eq 'true') { $args += '--prerelease' }

          gh @args @files
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'release exists, uploading assets instead'
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
          }
          Write-Host "published: $tag"
